<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>私聊示例（虚构内容，仅用于截图与测试）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f2f2f7;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0;
    background: rgba(242, 242, 247, .96);
    border-bottom: 1px solid #e3e3e8;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  header .title { font-weight: 600; font-size: 17px; color: #111; }
  header .sub { font-size: 12px; color: #8a8a8e; margin-top: 1px; }

  .thread { padding: 14px 14px 48px; display: flex; flex-direction: column; gap: 4px; }

  .day { text-align: center; font-size: 12px; color: #8a8a8e; margin: 10px 0 6px; }

  /* 一对一：没有昵称行，谁在说话全靠气泡站在哪一边 */
  .msg { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; }
  .msg.me { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 600;
  }
  .a-li { background: linear-gradient(135deg, #e8a37a, #d07f4f); }
  .a-me { background: linear-gradient(135deg, #6fd0b4, #2bc4a0); }

  .body { max-width: 76%; }
  .msg.me .body { display: flex; flex-direction: column; align-items: flex-end; }

  .bubble {
    padding: 9px 13px; border-radius: 16px;
    font-size: 16.5px; line-height: 1.45; word-break: break-word;
    display: inline-block;
  }
  .them .bubble { background: #fff; color: #111; border-top-left-radius: 5px; }
  .me   .bubble { background: #0a84ff; color: #fff; border-top-right-radius: 5px; }

  .foot { text-align: center; font-size: 11px; color: #b8b8bd; margin-top: 22px; }
</style>
</head>
<body>
  <header>
    <div class="avatar a-li" style="width:36px;height:36px;border-radius:50%">雨</div>
    <div>
      <div class="title">小雨</div>
      <div class="sub">在线</div>
    </div>
  </header>

  <div class="thread">
    <div class="day">今天 21:40</div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">你到家了吗</div></div>
    </div>

    <div class="msg me">
      <div class="avatar a-me">我</div>
      <div class="body"><div class="bubble">刚到</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">嗯</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">那你先忙吧</div></div>
    </div>

    <div class="msg me">
      <div class="avatar a-me">我</div>
      <div class="body"><div class="bubble">怎么了</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">没事，就是今天那事我心里有点不舒服</div></div>
    </div>

    <div class="msg me">
      <div class="avatar a-me">我</div>
      <div class="body"><div class="bubble">哪件事</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">下午开会的时候</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">你当着那么多人说我方案有问题</div></div>
    </div>

    <div class="msg me">
      <div class="avatar a-me">我</div>
      <div class="body"><div class="bubble">我是就事论事</div></div>
    </div>

    <div class="msg them">
      <div class="avatar a-li">雨</div>
      <div class="body"><div class="bubble">我知道，但我当时挺难堪的</div></div>
    </div>

    <div class="foot">虚构内容 · 仅用于演示与测试</div>
  </div>
</body>
</html>
